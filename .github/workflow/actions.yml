name: Vision ETL Production Pipeline

on:
  # Automated Cron Trigger (Runs at 12:00 UTC -> 5:00 PM PKT)
  schedule:
    - cron: '0 12 * * *'
    
  # Manual Trigger Override
  workflow_dispatch:

jobs:
  run-inference-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches dependencies so future daily runs are blazing fast

      - name: Install System Dependencies (OpenCV/Ultralytics requirements)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Replicate the lean CPU-only Torch install to prevent downloading 4GB+ of GPU drivers
          pip install torch==2.3.0 torchvision==0.18.0 --index-url https://download.pytorch.org/whl/cpu
          
          # Install the rest of the project requirements
          pip install -r requirements.txt

      - name: Step 1 - Extract and Transform (Inference -> JSONB/Arrays)
        env:
          # This injects your Production GitHub Secret directly into the Python environment
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python scripts/pipelines/extract_and_transform.py

      - name: Step 2 - Extract and Flatten (Arrays -> Dashboard Rows)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python scripts/pipelines/extract_and_flatten.py